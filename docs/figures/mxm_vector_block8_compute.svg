<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1e8449"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7d3c98"/>
    </marker>
    <style>
      .title { font: 700 29px Arial, sans-serif; fill: #17202a; }
      .panel-title { font: 700 23px Arial, sans-serif; fill: #17202a; }
      .subtitle { font: 15px Arial, sans-serif; fill: #566573; }
      .label { font: 600 14px Arial, sans-serif; fill: #273746; }
      .small { font: 13px Arial, sans-serif; fill: #34495e; }
      .tiny { font: 12px Consolas, monospace; fill: #273746; }
      .cell-vector { fill: #eaf2f8; stroke: #2874a6; stroke-width: 1.5; rx: 4; }
      .cell-block { fill: #f5eef8; stroke: #7d3c98; stroke-width: 1.5; rx: 4; }
      .activation { stroke: #1e8449; stroke-width: 3; fill: none; marker-end: url(#arrow-green); }
      .partial { stroke: #7d3c98; stroke-width: 2.5; fill: none; marker-end: url(#arrow-purple); }
      .divider { stroke: #d5d8dc; stroke-width: 1; }
      .brace { stroke: #566573; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="#ffffff"/>
  <text x="720" y="43" text-anchor="middle" class="title">MXM Resident-Weight Compute: Vector vs Block8</text>
  <text x="720" y="69" text-anchor="middle" class="subtitle">The physical 4 x 4 supercell array is unchanged; one Compute pulse carries either one or eight activation rows</text>
  <line x1="720" y1="94" x2="720" y2="855" class="divider"/>

  <!-- Vector panel -->
  <text x="355" y="116" text-anchor="middle" class="panel-title">Vector Compute</text>
  <text x="355" y="141" text-anchor="middle" class="subtitle">One activation row per tile, one 1 x 32 result row per pulse</text>

  <text x="42" y="181" class="label">Per tile input</text>
  <text x="42" y="202" class="small">2 byte streams = 1 x 8 BF16</text>
  <text x="184" y="184" text-anchor="middle" class="tiny">Y 0..7</text>
  <text x="304" y="184" text-anchor="middle" class="tiny">Y 8..15</text>
  <text x="424" y="184" text-anchor="middle" class="tiny">Y 16..23</text>
  <text x="544" y="184" text-anchor="middle" class="tiny">Y 24..31</text>

  <!-- Vector activations behind cells -->
  <path d="M52 245 H650" class="activation"/>
  <path d="M52 335 H650" class="activation"/>
  <path d="M52 425 H650" class="activation"/>
  <path d="M52 515 H650" class="activation"/>
  <text x="57" y="239" class="tiny">tile0 A[1x8]</text>
  <text x="57" y="329" class="tiny">tile1 A[1x8]</text>
  <text x="57" y="419" class="tiny">tile2 A[1x8]</text>
  <text x="57" y="509" class="tiny">tile3 A[1x8]</text>

  <g>
    <rect x="145" y="216" width="78" height="58" class="cell-vector"/><text x="184" y="238" text-anchor="middle" class="label">SC00</text><text x="184" y="257" text-anchor="middle" class="tiny">1x8 * 8x8</text>
    <rect x="265" y="216" width="78" height="58" class="cell-vector"/><text x="304" y="238" text-anchor="middle" class="label">SC01</text><text x="304" y="257" text-anchor="middle" class="tiny">1x8 * 8x8</text>
    <rect x="385" y="216" width="78" height="58" class="cell-vector"/><text x="424" y="238" text-anchor="middle" class="label">SC02</text><text x="424" y="257" text-anchor="middle" class="tiny">1x8 * 8x8</text>
    <rect x="505" y="216" width="78" height="58" class="cell-vector"/><text x="544" y="238" text-anchor="middle" class="label">SC03</text><text x="544" y="257" text-anchor="middle" class="tiny">1x8 * 8x8</text>

    <rect x="145" y="306" width="78" height="58" class="cell-vector"/><text x="184" y="328" text-anchor="middle" class="label">SC10</text><text x="184" y="347" text-anchor="middle" class="tiny">1x8 * 8x8</text>
    <rect x="265" y="306" width="78" height="58" class="cell-vector"/><text x="304" y="328" text-anchor="middle" class="label">SC11</text><text x="304" y="347" text-anchor="middle" class="tiny">1x8 * 8x8</text>
    <rect x="385" y="306" width="78" height="58" class="cell-vector"/><text x="424" y="328" text-anchor="middle" class="label">SC12</text><text x="424" y="347" text-anchor="middle" class="tiny">1x8 * 8x8</text>
    <rect x="505" y="306" width="78" height="58" class="cell-vector"/><text x="544" y="328" text-anchor="middle" class="label">SC13</text><text x="544" y="347" text-anchor="middle" class="tiny">1x8 * 8x8</text>

    <rect x="145" y="396" width="78" height="58" class="cell-vector"/><text x="184" y="418" text-anchor="middle" class="label">SC20</text><text x="184" y="437" text-anchor="middle" class="tiny">1x8 * 8x8</text>
    <rect x="265" y="396" width="78" height="58" class="cell-vector"/><text x="304" y="418" text-anchor="middle" class="label">SC21</text><text x="304" y="437" text-anchor="middle" class="tiny">1x8 * 8x8</text>
    <rect x="385" y="396" width="78" height="58" class="cell-vector"/><text x="424" y="418" text-anchor="middle" class="label">SC22</text><text x="424" y="437" text-anchor="middle" class="tiny">1x8 * 8x8</text>
    <rect x="505" y="396" width="78" height="58" class="cell-vector"/><text x="544" y="418" text-anchor="middle" class="label">SC23</text><text x="544" y="437" text-anchor="middle" class="tiny">1x8 * 8x8</text>

    <rect x="145" y="486" width="78" height="58" class="cell-vector"/><text x="184" y="508" text-anchor="middle" class="label">SC30</text><text x="184" y="527" text-anchor="middle" class="tiny">1x8 * 8x8</text>
    <rect x="265" y="486" width="78" height="58" class="cell-vector"/><text x="304" y="508" text-anchor="middle" class="label">SC31</text><text x="304" y="527" text-anchor="middle" class="tiny">1x8 * 8x8</text>
    <rect x="385" y="486" width="78" height="58" class="cell-vector"/><text x="424" y="508" text-anchor="middle" class="label">SC32</text><text x="424" y="527" text-anchor="middle" class="tiny">1x8 * 8x8</text>
    <rect x="505" y="486" width="78" height="58" class="cell-vector"/><text x="544" y="508" text-anchor="middle" class="label">SC33</text><text x="544" y="527" text-anchor="middle" class="tiny">1x8 * 8x8</text>
  </g>

  <!-- Vector northbound partial sums -->
  <path d="M184 486 V458" class="partial"/><path d="M184 396 V368" class="partial"/><path d="M184 306 V278" class="partial"/><path d="M184 216 V197" class="partial"/>
  <path d="M304 486 V458" class="partial"/><path d="M304 396 V368" class="partial"/><path d="M304 306 V278" class="partial"/><path d="M304 216 V197" class="partial"/>
  <path d="M424 486 V458" class="partial"/><path d="M424 396 V368" class="partial"/><path d="M424 306 V278" class="partial"/><path d="M424 216 V197" class="partial"/>
  <path d="M544 486 V458" class="partial"/><path d="M544 396 V368" class="partial"/><path d="M544 306 V278" class="partial"/><path d="M544 216 V197" class="partial"/>

  <path d="M160 567 V579 H568 V567" class="brace"/>
  <text x="364" y="602" text-anchor="middle" class="label">concatenate four 1 x 8 FP32 segments = 1 x 32</text>
  <text x="364" y="627" text-anchor="middle" class="small">64 MACs per supercell, 1 accumulator row selected by the pulse</text>
  <rect x="78" y="655" width="570" height="73" fill="#eaf2f8" stroke="#2874a6" rx="5"/>
  <text x="98" y="682" class="label">Stream destination</text>
  <text x="98" y="706" class="small">Emit one FP32 output row over 4 west byte streams; consecutive pulses produce consecutive rows.</text>

  <!-- Block8 panel -->
  <text x="1080" y="116" text-anchor="middle" class="panel-title">Block8 Compute</text>
  <text x="1080" y="141" text-anchor="middle" class="subtitle">Eight activation rows per tile, one 8 x 32 result block per pulse</text>

  <text x="752" y="181" class="label">Per tile input</text>
  <text x="752" y="202" class="small">16 byte streams = 8 x 8 BF16</text>
  <text x="884" y="184" text-anchor="middle" class="tiny">Y 0..7</text>
  <text x="1004" y="184" text-anchor="middle" class="tiny">Y 8..15</text>
  <text x="1124" y="184" text-anchor="middle" class="tiny">Y 16..23</text>
  <text x="1244" y="184" text-anchor="middle" class="tiny">Y 24..31</text>

  <path d="M762 245 H1360" class="activation"/>
  <path d="M762 335 H1360" class="activation"/>
  <path d="M762 425 H1360" class="activation"/>
  <path d="M762 515 H1360" class="activation"/>
  <text x="767" y="239" class="tiny">tile0 A[8x8]</text>
  <text x="767" y="329" class="tiny">tile1 A[8x8]</text>
  <text x="767" y="419" class="tiny">tile2 A[8x8]</text>
  <text x="767" y="509" class="tiny">tile3 A[8x8]</text>

  <g>
    <rect x="845" y="216" width="78" height="58" class="cell-block"/><text x="884" y="238" text-anchor="middle" class="label">SC00</text><text x="884" y="257" text-anchor="middle" class="tiny">8x8 * 8x8</text>
    <rect x="965" y="216" width="78" height="58" class="cell-block"/><text x="1004" y="238" text-anchor="middle" class="label">SC01</text><text x="1004" y="257" text-anchor="middle" class="tiny">8x8 * 8x8</text>
    <rect x="1085" y="216" width="78" height="58" class="cell-block"/><text x="1124" y="238" text-anchor="middle" class="label">SC02</text><text x="1124" y="257" text-anchor="middle" class="tiny">8x8 * 8x8</text>
    <rect x="1205" y="216" width="78" height="58" class="cell-block"/><text x="1244" y="238" text-anchor="middle" class="label">SC03</text><text x="1244" y="257" text-anchor="middle" class="tiny">8x8 * 8x8</text>

    <rect x="845" y="306" width="78" height="58" class="cell-block"/><text x="884" y="328" text-anchor="middle" class="label">SC10</text><text x="884" y="347" text-anchor="middle" class="tiny">8x8 * 8x8</text>
    <rect x="965" y="306" width="78" height="58" class="cell-block"/><text x="1004" y="328" text-anchor="middle" class="label">SC11</text><text x="1004" y="347" text-anchor="middle" class="tiny">8x8 * 8x8</text>
    <rect x="1085" y="306" width="78" height="58" class="cell-block"/><text x="1124" y="328" text-anchor="middle" class="label">SC12</text><text x="1124" y="347" text-anchor="middle" class="tiny">8x8 * 8x8</text>
    <rect x="1205" y="306" width="78" height="58" class="cell-block"/><text x="1244" y="328" text-anchor="middle" class="label">SC13</text><text x="1244" y="347" text-anchor="middle" class="tiny">8x8 * 8x8</text>

    <rect x="845" y="396" width="78" height="58" class="cell-block"/><text x="884" y="418" text-anchor="middle" class="label">SC20</text><text x="884" y="437" text-anchor="middle" class="tiny">8x8 * 8x8</text>
    <rect x="965" y="396" width="78" height="58" class="cell-block"/><text x="1004" y="418" text-anchor="middle" class="label">SC21</text><text x="1004" y="437" text-anchor="middle" class="tiny">8x8 * 8x8</text>
    <rect x="1085" y="396" width="78" height="58" class="cell-block"/><text x="1124" y="418" text-anchor="middle" class="label">SC22</text><text x="1124" y="437" text-anchor="middle" class="tiny">8x8 * 8x8</text>
    <rect x="1205" y="396" width="78" height="58" class="cell-block"/><text x="1244" y="418" text-anchor="middle" class="label">SC23</text><text x="1244" y="437" text-anchor="middle" class="tiny">8x8 * 8x8</text>

    <rect x="845" y="486" width="78" height="58" class="cell-block"/><text x="884" y="508" text-anchor="middle" class="label">SC30</text><text x="884" y="527" text-anchor="middle" class="tiny">8x8 * 8x8</text>
    <rect x="965" y="486" width="78" height="58" class="cell-block"/><text x="1004" y="508" text-anchor="middle" class="label">SC31</text><text x="1004" y="527" text-anchor="middle" class="tiny">8x8 * 8x8</text>
    <rect x="1085" y="486" width="78" height="58" class="cell-block"/><text x="1124" y="508" text-anchor="middle" class="label">SC32</text><text x="1124" y="527" text-anchor="middle" class="tiny">8x8 * 8x8</text>
    <rect x="1205" y="486" width="78" height="58" class="cell-block"/><text x="1244" y="508" text-anchor="middle" class="label">SC33</text><text x="1244" y="527" text-anchor="middle" class="tiny">8x8 * 8x8</text>
  </g>

  <path d="M884 486 V458" class="partial"/><path d="M884 396 V368" class="partial"/><path d="M884 306 V278" class="partial"/><path d="M884 216 V197" class="partial"/>
  <path d="M1004 486 V458" class="partial"/><path d="M1004 396 V368" class="partial"/><path d="M1004 306 V278" class="partial"/><path d="M1004 216 V197" class="partial"/>
  <path d="M1124 486 V458" class="partial"/><path d="M1124 396 V368" class="partial"/><path d="M1124 306 V278" class="partial"/><path d="M1124 216 V197" class="partial"/>
  <path d="M1244 486 V458" class="partial"/><path d="M1244 396 V368" class="partial"/><path d="M1244 306 V278" class="partial"/><path d="M1244 216 V197" class="partial"/>

  <path d="M860 567 V579 H1268 V567" class="brace"/>
  <text x="1064" y="602" text-anchor="middle" class="label">concatenate four 8 x 8 FP32 segments = 8 x 32</text>
  <text x="1064" y="627" text-anchor="middle" class="small">512 MACs per supercell, 8 rows share the same resident weights</text>
  <rect x="778" y="655" width="570" height="73" fill="#f5eef8" stroke="#7d3c98" rx="5"/>
  <text x="798" y="682" class="label">Block accumulator destination</text>
  <text x="798" y="706" class="small">Store one logical 8 x 32 row; AccumulatorRead drains four 8 x 8 segments in four cycles.</text>

  <!-- Footer comparison -->
  <line x1="40" y1="758" x2="1400" y2="758" class="divider"/>
  <text x="720" y="794" text-anchor="middle" class="panel-title">Same weights and dataflow, 8x more row parallelism per pulse</text>
  <text x="720" y="824" text-anchor="middle" class="subtitle">Activations propagate east through four supercell columns; FP32 partial sums reduce north across four tiles.</text>
  <text x="720" y="853" text-anchor="middle" class="small">Vector is fine-grained and can emit directly to streams. Block8 consumes 8x the activation bandwidth and uses the wide block accumulator.</text>
  <text x="720" y="881" text-anchor="middle" class="tiny">Vector: 2 byte streams, 1 x 32 result, 64 MAC/cell   |   Block8: 16 byte streams, 8 x 32 result, 512 MAC/cell</text>
</svg>
